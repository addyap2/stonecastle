<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>Fracas des armes — Jan Stenborg</title>
  <link rel="stylesheet" href="/reader/reader.css">

<body>

  <main>
    <div id="status" role="status" aria-live="polite">Ouverture du livre…</div>
    <article id="book" class="book" hidden></article>
    <nav class="page-nav" aria-label="Navigation du livre">
      <button id="previous" type="button" disabled>← Précédent</button>
      <span id="progress"></span>
      <button id="next" type="button" disabled>Suivant →</button>
